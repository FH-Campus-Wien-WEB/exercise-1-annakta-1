<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movies!</title>
    <style>
    /* Part 3: Styling the page
    In this final part you will add some styling by applying CSS. 
    You will add CSS rules to the style element in the head of the page. */
        body {
            font-family: Trebuchet MS, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        ul {
            padding-left: 20px;
        }

        li {
            margin-bottom: 4px;
        }

        h3 {
            margin-bottom: 5px;
            margin-top: 15px;
        }

        article {
            background-color: white;
            border-radius: 12px;
            margin: 20px auto;
            padding: 20px;
            max-width: 800px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        img {
            max-width: 400px;
            border-radius: 10px;
            display: block;
            margin-bottom: 15px;
        }

        h2 {
            margin-top: 0;
        }

        p {
            line-height: 1.5;
        }

        span {
            margin-right: 8px;
        }

        .genre {
            background-color: #fedbf8;
            padding: 4px 8px;
            border-radius: 8px;
            display: inline-block;
            margin-right: 8px;
            margin-top: 4px;
        }

        .label {
            font-weight: bold;
        }
    </style>
    
    <script>
    /* Part 2: Rendering the movie data on the client side
    In this part you will have to dynamically add new HTML elements to the body of the application's HTML page. 
    Before you can use the information, you will have to find a way to parse the JSON data into JavaScript objects.
    1. Parse the JSON movie data received from the server into JavaScript objects
    2. Loop through each movie object in the array
    3. For each movie, dynamically create HTML elements that display all the movie information
    4. Append these elements to the page body. */

        window.onload = function () {
            const xhr = new XMLHttpRequest();

            xhr.onload = function () {
                const bodyElement = document.querySelector("body");

                if (xhr.status === 200) {
                    const movies = JSON.parse(xhr.responseText);

                    const heading = document.createElement("h1");
                    heading.textContent = "My Movies";
                    bodyElement.appendChild(heading);

                    movies.forEach(function (movie) {
                        const article = document.createElement("article");

                        const title = document.createElement("h2");
                        title.textContent = movie.Title;
                        article.appendChild(title);

                        const poster = document.createElement("img");
                        poster.src = movie.Poster;
                        article.appendChild(poster);

                        const released = document.createElement("p");
                        released.textContent = "Released: " + movie.Released;
                        article.appendChild(released);

                        const runtime = document.createElement("p");
                        runtime.textContent = "Runtime: " + movie.Runtime + " min";
                        article.appendChild(runtime);

                        const genres = document.createElement("p");
                        genres.textContent = "Genres: ";
                        movie.Genres.forEach(function (genre) {
                            const genreTag = document.createElement("span");
                            genreTag.className = "genre";
                            genreTag.textContent = genre;
                            genres.appendChild(genreTag);
                        });
                        article.appendChild(genres);

                        const directorsTitle = document.createElement("h3");
                        directorsTitle.textContent = "Directors";
                        article.appendChild(directorsTitle);

                        const directorsList = document.createElement("ul");
                        movie.Directors.forEach(function(director) {
                            const li = document.createElement("li");
                            li.textContent = director;
                            directorsList.appendChild(li);
                        });
                        article.appendChild(directorsList);

                        const writersTitle = document.createElement("h3");
                        writersTitle.textContent = "Writers";
                        article.appendChild(writersTitle);

                        const writersList = document.createElement("ul");
                        movie.Writers.forEach(function(writer) {
                            const li = document.createElement("li");
                            li.textContent = writer;
                            writersList.appendChild(li);
                        });
                        article.appendChild(writersList);

                        const actorsTitle = document.createElement("h3");
                        actorsTitle.textContent = "Actors";
                        article.appendChild(actorsTitle);

                        const actorsList = document.createElement("ul");
                        movie.Actors.forEach(function(actor) {
                            const li = document.createElement("li");
                            li.textContent = actor;
                            actorsList.appendChild(li);
                        });
                        article.appendChild(actorsList);

                        const plot = document.createElement("p");
                        plot.textContent = "Plot: " + movie.Plot;
                        article.appendChild(plot);

                        const metascore = document.createElement("p");
                        metascore.textContent = "Metascore: " + movie.Metascore;
                        article.appendChild(metascore);

                        const imdbRating = document.createElement("p");
                        imdbRating.textContent = "IMDb Rating: " + movie.imdbRating;
                        article.appendChild(imdbRating);

                        bodyElement.appendChild(article);
                    });
                } else {
                    bodyElement.textContent =
                        "Daten konnten nicht geladen werden, Status " +
                        xhr.status + " - " + xhr.statusText;
                }
            };

            xhr.open("GET", "/movies");
            xhr.send();
        };
    </script>
</head>
<body>
</body>
</html>
